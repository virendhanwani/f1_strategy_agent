[project]
name = "f1-strategy-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viren Dhanwani", email = "virenpdhanwani@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastf1>=3.8",
    "fastmcp>=3.4.7",
    "langchain-core>=1.6.0",
    "langchain-openrouter>=0.2.8",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.11.1",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
f1-strategy-agent = "f1_strategy_agent:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
